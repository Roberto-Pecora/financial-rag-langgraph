[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frag"
version = "0.1.0"
description = "Financial RAG on LangGraph: a stateful retrieve-grade-answer graph with a tool-using agent, self-hosted Langfuse observability, and deterministic retrieval evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph==0.2.45",
  "langchain-core==0.3.15",
  "langchain-openai==0.2.5",
  "langfuse==2.53.9",
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.8.2",
  "pydantic-settings==2.5.2",
  "numpy==2.0.1",
  "pandas==2.2.2",
  "rank-bm25==0.2.2",
  "python-dotenv==1.0.1",
  "qdrant-client==1.11.3",
  "sentence-transformers==3.1.1",
  "networkx==3.3",
  "rapidfuzz==3.10.1",
  "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.2",
  "pytest-cov==5.0.0",
  "ruff==0.6.9",
  "respx==0.21.1",
]
sources = [
  "pymupdf==1.24.11",
  "pdfplumber==0.11.4",
  "beautifulsoup4==4.12.3",
  "lxml==5.3.0",
  "requests==2.32.3",
]
data = [
  "datasets==3.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
