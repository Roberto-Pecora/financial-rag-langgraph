# Local production-grade stack: vector store + self-hosted Langfuse.
# `docker compose up -d` then set LANGFUSE_* in .env from the Langfuse UI keys.
services:
  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
    volumes:
      - langfuse_ch:/var/lib/clickhouse
    restart: unless-stopped

  redis:
    image: redis:7
    command: --requirepass redis
    restart: unless-stopped

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
    volumes:
      - langfuse_minio:/data
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on: [langfuse-db, clickhouse, redis, minio]
    environment: &langfuse-env
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: clickhouse
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_CONNECTION_STRING: redis://:redis@redis:6379
      # v3 event/media uploads (S3-compatible MinIO)
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: miniosecret
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: change-me-in-prod
      ENCRYPTION_KEY: affe9111c2c0a92294e32c183b45e8073b1dcdba39caad00ab961dd53b6b8379
      NEXTAUTH_SECRET: change-me-in-prod
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:3
    depends_on: [langfuse-worker]
    ports:
      - "3000:3000"
    environment:
      <<: *langfuse-env
      NEXTAUTH_URL: http://localhost:3000
      # Headless bootstrap: provision an org/project/user with known keys on first
      # boot, so the app can trace without any manual UI signup. Change for real use.
      LANGFUSE_INIT_ORG_ID: frag-org
      LANGFUSE_INIT_PROJECT_ID: frag-project
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-frag-local
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-frag-local
      LANGFUSE_INIT_USER_EMAIL: dev@example.com
      LANGFUSE_INIT_USER_NAME: dev
      LANGFUSE_INIT_USER_PASSWORD: frag-local-password
    restart: unless-stopped

volumes:
  qdrant_data:
  langfuse_pg:
  langfuse_ch:
  langfuse_minio:
